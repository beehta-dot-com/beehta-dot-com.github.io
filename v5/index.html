<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beehta.com - Directory</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/index.css" />
</head>
<body id="top">

<header id="siteHeader">
  <div class="header-inner">
    <a href="/" class="brand">beehta<em>.com</em></a>
    <a href="#top" class="btn-top">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      Go to top
    </a>
  </div>
</header>

<main class="page-wrap">
  <section class="hero">
    <p class="hero-eyebrow mono">beehta.com</p>
    <h1>A collection of small applications for everyday digital work.</h1>
    <p class="hero-sub">Curated tools running on their own subdomains.</p>
  </section>

  <section class="control-bar" id="directory">
    <div class="search-field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Search applications..." autocomplete="off" />
      <kbd class="search-kbd mono">⌘K</kbd>
    </div>
    <div class="filter-row" id="filterRow"></div>
  </section>

  <section class="catalogue">
    <div class="catalogue-header">
      <h2 class="section-title" id="sectionTitle">Applications</h2>
      <span class="section-count mono" id="sectionCount"></span>
    </div>
    <div class="apps-grid" id="appsList"></div>
  </section>
</main>

<footer id="siteFooter"></footer>
<script src="assets/js/partials.js"></script>
<script>Partials.renderFooter();</script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
