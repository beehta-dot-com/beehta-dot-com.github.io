<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
<rect width="700" height="420" fill="#0F1B29"/>
<rect x="0" y="0" width="700" height="34" fill="#102033"/>
<circle cx="20" cy="17" r="5" fill="#66717D"/>
<circle cx="38" cy="17" r="5" fill="#66717D"/>
<text x="60" y="22" font-family="DM Sans, sans-serif" font-size="12" fill="#93A0AD">main.js</text>

<g font-family="monospace" font-size="13" fill="#93A0AD">
<text x="24" y="70"><tspan fill="#E5B83B">function</tspan> total(items) {</text>
<text x="24" y="94">  <tspan fill="#16845A">return</tspan> items.reduce((sum, i) =></text>
<text x="24" y="118">    sum + i.price, 0);</text>
<text x="24" y="142">}</text>
</g>

<rect x="24" y="180" width="652" height="200" rx="6" fill="#0A141F" stroke="#243A50"/>
<text x="40" y="206" font-family="monospace" font-size="12" fill="#66717D">Output</text>
<text x="40" y="232" font-family="monospace" font-size="13" fill="#F5F4F0">42.50</text>
</svg>
